<script>
(() => {

const WORLD_URL =
"https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_110m_admin_0_countries.geojson";

const API_BASE =
"https://www.geoboundaries.org/api/current/gbOpen";

const STORE = "dreamtrip_global_v2";

const svg = d3.select("#map");

const loading = document.getElementById("loading");
const backBtn = document.getElementById("backBtn");
const mapTitle = document.getElementById("mapTitle");
const pageTitle = document.getElementById("pageTitle");
const pageDescription = document.getElementById("pageDescription");
const message = document.getElementById("message");

const stat1Label = document.getElementById("stat1Label");
const stat2Label = document.getElementById("stat2Label");
const stat1 = document.getElementById("stat1");
const stat2 = document.getElementById("stat2");

const progressLabel = document.getElementById("progressLabel");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");

const unitPanel = document.getElementById("unitPanel");
const unitTitle = document.getElementById("unitTitle");
const unitList = document.getElementById("unitList");

let state = loadState();

let worldFeatures = [];
let currentCountry = null;
let currentGeo = null;
let currentUnits = [];
let currentZoom = null;

const countryCache = new Map();

/* SALVATAGGIO */

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "{}");

    return {
      countries: saved.countries || {},
      wholeTerritories: saved.wholeTerritories || {}
    };
  } catch (e) {
    return {
      countries: {},
      wholeTerritories: {}
    };
  }
}

function saveState() {
  localStorage.setItem(STORE, JSON.stringify(state));
}

/* CODICE ISO */

function cleanCode(value) {
  if (typeof value !== "string") return null;

  const code = value.toUpperCase().trim();

  if (/^[A-Z]{3}$/.test(code) && code !== "-99") {
    return code;
  }

  return null;
}

function iso3(feature) {
  const p = feature.properties || {};

  return (
    cleanCode(p.ISO_A3_EH) ||
    cleanCode(p.ISO_A3) ||
    cleanCode(p.ADM0_A3) ||
    cleanCode(p.SOV_A3) ||
    cleanCode(p.WB_A3) ||
    null
  );
}

/* NOMI */

function countryName(feature) {
  const p = feature.properties || {};

  return (
    p.NAME_IT ||
    p.NAME_LONG ||
    p.NAME ||
    p.ADMIN ||
    "Territorio"
  );
}

function countryId(feature, index = 0) {
  const code = iso3(feature);

  if (code) return code;

  const p = feature.properties || {};

  return (
    "territory_" +
    String(
      p.NAME ||
      p.ADMIN ||
      index
    )
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "_")
  );
}

/* AREE INTERNE */

function unitKey(feature, index) {
  const p = feature.properties || {};

  return String(
    p.shapeID ||
    p.shapeISO ||
    p.shapeName ||
    p.NAME_1 ||
    p.name ||
    index
  );
}

function unitName(feature, index) {
  const p = feature.properties || {};

  return String(
    p.shapeName ||
    p.NAME_1 ||
    p.name ||
    p.NAME ||
    ("Area " + (index + 1))
  );
}

/* DATI PAESE */

function countryRecord(code, name) {
  if (!state.countries[code]) {
    state.countries[code] = {
      name: name,
      visited: [],
      total: 0,
      level: null
    };
  }

  const record = state.countries[code];

  if (!Array.isArray(record.visited)) {
    record.visited = [];
  }

  record.name = name;

  return record;
}

/* MONDO */

function worldTotal() {
  return worldFeatures.length;
}

function isFeatureVisited(feature, index) {
  const code = iso3(feature);

  if (code) {
    const record = state.countries[code];

    return !!(
      record &&
      Array.isArray(record.visited) &&
      record.visited.length
    );
  }

  const id = countryId(feature, index);

  return !!state.wholeTerritories[id];
}

function visitedCountryCount() {
  return worldFeatures.filter((feature, index) =>
    isFeatureVisited(feature, index)
  ).length;
}

function worldPct() {
  const total = worldTotal();

  if (!total) return 0;

  return Math.round(
    (visitedCountryCount() / total) * 100
  );
}

/* PERCENTUALE PAESE */

function countryPct(code) {
  const record = state.countries[code];

  if (
    !record ||
    !record.visited ||
    !record.visited.length
  ) {
    return 0;
  }

  if (!record.total) return 1;

  return Math.round(
    (record.visited.length / record.total) * 100
  );
}

function colorForFeature(feature, index) {
  const code = iso3(feature);

  let pct = 0;

  if (code) {
    pct = countryPct(code);
  } else {
    const id = countryId(feature, index);

    pct = state.wholeTerritories[id]
      ? 100
      : 0;
  }

  if (!pct) return "#eee7eb";

  return d3.interpolateRgb(
    "#f4c9da",
    "#b94d7b"
  )(Math.max(0.22, pct / 100));
}

/* MESSAGGI */

function showMessage(text) {
  message.textContent = text;
}

/* STATISTICHE MONDO */

function updateWorldStats() {
  const total = worldTotal();
  const visited = visitedCountryCount();
  const pct = worldPct();

  stat1Label.textContent = "Paesi/territori visitati";
  stat2Label.textContent = "Mondo visitato";

  stat1.textContent = visited + " / " + total;
  stat2.textContent = pct + "%";

  progressLabel.textContent = "Esplorazione del mondo";
  progressText.textContent = pct + "%";
  progressFill.style.width = pct + "%";
}

/* STATISTICHE PAESE */

function updateCountryStats() {
  if (!currentCountry) return;

  if (!currentCountry.code) {
    const selected =
      !!state.wholeTerritories[currentCountry.id];

    stat1Label.textContent = "Territorio visitato";
    stat2Label.textContent =
      currentCountry.name + " visitato";

    stat1.textContent = selected ? "Sì" : "No";
    stat2.textContent = selected ? "100%" : "0%";

    progressLabel.textContent =
      "Esplorazione di " + currentCountry.name;

    progressText.textContent =
      selected ? "100%" : "0%";

    progressFill.style.width =
      selected ? "100%" : "0%";

    return;
  }

  const record = countryRecord(
    currentCountry.code,
    currentCountry.name
  );

  const total =
    record.total ||
    currentUnits.length ||
    1;

  const visited = record.visited.length;

  const pct = Math.round(
    (visited / total) * 100
  );

  stat1Label.textContent = "Aree visitate";
  stat2Label.textContent =
    currentCountry.name + " visitato";

  stat1.textContent =
    visited + " / " + total;

  stat2.textContent =
    pct + "%";

  progressLabel.textContent =
    "Esplorazione di " +
    currentCountry.name;

  progressText.textContent =
    pct + "%";

  progressFill.style.width =
    pct + "%";
}

/* ZOOM */

function setupZoom(layer, width, height, maxZoom) {
  const zoom = d3.zoom()
    .scaleExtent([1, maxZoom])
    .extent([
      [0, 0],
      [width, height]
    ])
    .translateExtent([
      [-width * 0.7, -height * 0.7],
      [width * 1.7, height * 1.7]
    ])
    .on("zoom", event => {
      layer.attr(
        "transform",
        event.transform
      );
    });

  svg.call(zoom);

  svg.call(
    zoom.transform,
    d3.zoomIdentity
  );

  currentZoom = zoom;
}

document
.getElementById("zin")
.addEventListener("click", () => {
  if (!currentZoom) return;

  svg
    .transition()
    .duration(150)
    .call(
      currentZoom.scaleBy,
      1.45
    );
});

document
.getElementById("zout")
.addEventListener("click", () => {
  if (!currentZoom) return;

  svg
    .transition()
    .duration(150)
    .call(
      currentZoom.scaleBy,
      1 / 1.45
    );
});

document
.getElementById("zreset")
.addEventListener("click", () => {
  if (!currentZoom) return;

  svg
    .transition()
    .duration(180)
    .call(
      currentZoom.transform,
      d3.zoomIdentity
    );
});

/* CARICA MONDO */

async function loadWorld() {
  currentCountry = null;
  currentGeo = null;
  currentUnits = [];

  unitPanel.classList.remove("show");

  backBtn.style.display = "none";

  pageTitle.textContent =
    "Il mio mondo";

  pageDescription.textContent =
    "Tocca qualsiasi Paese o territorio per esplorarlo.";

  mapTitle.textContent =
    "🌎 Mondo";

  showMessage(
    "Tocca un Paese per iniziare 🌍"
  );

  loading.style.display =
    "block";

  svg.style(
    "display",
    "none"
  );

  try {
    if (!worldFeatures.length) {
      const geo =
        await d3.json(WORLD_URL);

      worldFeatures =
        geo.features.filter(feature => {
          const name =
            countryName(feature);

          return name !== "Antarctica";
        });
    }

    loading.style.display =
      "none";

    svg.style(
      "display",
      "block"
    );

    renderWorld();
    updateWorldStats();

  } catch (error) {
    console.error(error);

    loading.textContent =
      "Non riesco a caricare la mappa mondiale.";
  }
}

/* DISEGNA MONDO */

function renderWorld() {
  svg.selectAll("*").remove();

  svg.attr(
    "viewBox",
    "0 0 1000 560"
  );

  const projection =
    d3.geoNaturalEarth1()
      .fitExtent(
        [
          [8, 8],
          [992, 552]
        ],
        {
          type: "FeatureCollection",
          features: worldFeatures
        }
      );

  const path =
    d3.geoPath(projection);

  const layer =
    svg.append("g");

  setupZoom(
    layer,
    1000,
    560,
    11
  );

  layer
    .selectAll("path")
    .data(worldFeatures)
    .join("path")
    .attr("d", path)
    .attr(
      "class",
      "country"
    )
    .style(
      "fill",
      (feature, index) =>
        colorForFeature(
          feature,
          index
        )
    )
    .on(
      "click",
      (event, feature) => {

        if (event.defaultPrevented) {
          return;
        }

        openCountry(feature);
      }
    );
}

/* APRE PAESE */

async function openCountry(feature) {
  const name =
    countryName(feature);

  const code =
    iso3(feature);

  const id =
    countryId(feature);

  currentCountry = {
    feature,
    code,
    id,
    name
  };

  pageTitle.textContent =
    name;

  pageDescription.textContent =
    code
      ? "Tocca le aree interne che hai visitato."
      : "Questo territorio non ha suddivisioni compatibili: puoi comunque segnarlo interamente come visitato.";

  mapTitle.textContent =
    "📍 " + name;

  backBtn.style.display =
    "block";

  unitPanel.classList.remove(
    "show"
  );

  if (!code) {
    showWholeTerritory(feature);
    return;
  }

  showMessage(
    "Caricamento delle aree di " +
    name +
    "…"
  );

  loading.style.display =
    "block";

  svg.style(
    "display",
    "none"
  );

  try {
    let pack =
      countryCache.get(code);

    if (!pack) {
      pack =
        await fetchCountryUnits(
          code
        );

      countryCache.set(
        code,
        pack
      );
    }

    currentGeo =
      pack.geo;

    currentUnits =
      pack.units;

    const record =
      countryRecord(
        code,
        name
      );

    record.total =
      currentUnits.length;

    record.level =
      pack.level;

    saveState();

    loading.style.display =
      "none";

    svg.style(
      "display",
      "block"
    );

    renderCountry();
    renderUnitList();
    updateCountryStats();

  } catch (error) {
    console.error(error);

    showWholeTerritory(feature);
  }
}

/* TERRITORIO INTERO */

function showWholeTerritory(feature) {
  loading.style.display =
    "none";

  svg.style(
    "display",
    "block"
  );

  currentGeo = {
    type: "FeatureCollection",
    features: [feature]
  };

  currentUnits = [];

  svg.selectAll("*").remove();

  svg.attr(
    "viewBox",
    "0 0 900 700"
  );

  const projection =
    d3.geoMercator()
      .fitExtent(
        [
          [60, 50],
          [840, 650]
        ],
        currentGeo
      );

  const path =
    d3.geoPath(projection);

  const layer =
    svg.append("g");

  setupZoom(
    layer,
    900,
    700,
    12
  );

  const selected =
    !!state.wholeTerritories[
      currentCountry.id
    ];

  layer
    .append("path")
    .datum(feature)
    .attr("d", path)
    .attr("class", "unit")
    .style(
      "fill",
      selected
        ? "#d979a3"
        : "#f4e9ee"
    )
    .on("click", () => {
      toggleWholeTerritory();
    });

  unitPanel.classList.add(
    "show"
  );

  unitTitle.textContent =
    currentCountry.name;

  unitList.innerHTML = "";

  const button =
    document.createElement(
      "button"
    );

  button.type = "button";

  button.className =
    "unitBtn" +
    (selected ? " visited" : "");

  button.textContent =
    selected
      ? "✓ Segnato come visitato"
      : "Segna come visitato";

  button.addEventListener(
    "click",
    toggleWholeTerritory
  );

  unitList.appendChild(
    button
  );

  updateCountryStats();

  showMessage(
    "Puoi comunque colorare tutto questo territorio."
  );
}

function toggleWholeTerritory() {
  const id =
    currentCountry.id;

  if (
    state.wholeTerritories[id]
  ) {
    delete state.wholeTerritories[id];

    showMessage(
      currentCountry.name +
      " rimosso dai luoghi visitati."
    );
  } else {
    state.wholeTerritories[id] =
      true;

    showMessage(
      "✨ Hai visitato " +
      currentCountry.name +
      "!"
    );
  }

  saveState();

  showWholeTerritory(
    currentCountry.feature
  );
}

/* CARICA SUDDIVISIONI */

async function fetchCountryUnits(code) {
  const levels =
    code === "ITA"
      ? ["ADM1", "ADM2"]
      : ["ADM1", "ADM2"];

  for (const level of levels) {
    try {
      const meta =
        await d3.json(
          API_BASE +
          "/" +
          code +
          "/" +
          level +
          "/"
        );

      if (
        !meta ||
        !meta.simplifiedGeometryGeoJSON
      ) {
        continue;
      }

      const geo =
        await d3.json(
          meta.simplifiedGeometryGeoJSON
        );

      if (
        !geo ||
        !Array.isArray(
          geo.features
        ) ||
        !geo.features.length
      ) {
        continue;
      }

      const units =
        geo.features.map(
          (feature, index) => ({
            feature,
            key: unitKey(
              feature,
              index
            ),
            name: unitName(
              feature,
              index
            )
          })
        );

      return {
        geo,
        units,
        level
      };

    } catch (error) {
      console.warn(
        code,
        level,
        error
      );
    }
  }

  throw new Error(
    "Nessuna suddivisione disponibile"
  );
}

/* DISEGNA PAESE */

function renderCountry() {
  svg.selectAll("*").remove();

  svg.attr(
    "viewBox",
    "0 0 900 760"
  );

  const projection =
    d3.geoMercator()
      .fitExtent(
        [
          [45, 35],
          [855, 725]
        ],
        currentGeo
      );

  const path =
    d3.geoPath(projection);

  const layer =
    svg.append("g");

  setupZoom(
    layer,
    900,
    760,
    14
  );

  const record =
    countryRecord(
      currentCountry.code,
      currentCountry.name
    );

  layer
    .selectAll("path")
    .data(currentUnits)
    .join("path")
    .attr(
      "d",
      unit =>
        path(unit.feature)
    )
    .attr(
      "class",
      "unit"
    )
    .style(
      "fill",
      unit =>
        record.visited.includes(
          unit.key
        )
          ? "#d979a3"
          : "#f4e9ee"
    )
    .on(
      "click",
      (event, unit) => {

        if (
          event.defaultPrevented
        ) {
          return;
        }

        toggleUnit(
          unit.key,
          unit.name
        );
      }
    );

  const labels =
    [...currentUnits]
      .sort(
        (a, b) =>
          d3.geoArea(
            b.feature
          ) -
          d3.geoArea(
            a.feature
          )
      )
      .slice(
        0,
        Math.min(
          18,
          currentUnits.length
        )
      );

  layer
    .selectAll("text")
    .data(labels)
    .join("text")
    .attr(
      "class",
      "label"
    )
    .attr(
      "transform",
      unit => {
        const center =
          path.centroid(
            unit.feature
          );

        return (
          "translate(" +
          center[0] +
          "," +
          center[1] +
          ")"
        );
      }
    )
    .text(unit => {
      if (
        unit.name.length > 18
      ) {
        return (
          unit.name.slice(
            0,
            16
          ) + "…"
        );
      }

      return unit.name;
    });

  showMessage(
    "Tocca un'area per segnarla come visitata 💗"
  );
}

/* SEGNA AREA */

function toggleUnit(key, name) {
  const record =
    countryRecord(
      currentCountry.code,
      currentCountry.name
    );

  const index =
    record.visited.indexOf(
      key
    );

  if (index >= 0) {
    record.visited.splice(
      index,
      1
    );

    showMessage(
      name +
      " rimossa dai luoghi visitati."
    );
  } else {
    record.visited.push(
      key
    );

    showMessage(
      "✨ Hai visitato " +
      name +
      "!"
    );
  }

  saveState();

  renderCountry();
  renderUnitList();
  updateCountryStats();
}

/* LISTA AREE */

function renderUnitList() {
  unitTitle.textContent =
    "Aree di " +
    currentCountry.name;

  unitList.innerHTML = "";

  const record =
    countryRecord(
      currentCountry.code,
      currentCountry.name
    );

  [...currentUnits]
    .sort(
      (a, b) =>
        a.name.localeCompare(
          b.name,
          "it"
        )
    )
    .forEach(unit => {
      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      const selected =
        record.visited.includes(
          unit.key
        );

      button.className =
        "unitBtn" +
        (selected
          ? " visited"
          : "");

      button.textContent =
        (selected ? "✓ " : "") +
        unit.name;

      button.addEventListener(
        "click",
        () => {
          toggleUnit(
            unit.key,
            unit.name
          );
        }
      );

      unitList.appendChild(
        button
      );
    });

  unitPanel.classList.add(
    "show"
  );
}

/* INDIETRO */

backBtn.addEventListener(
  "click",
  loadWorld
);

/* AVVIO */

loadWorld();

})();
</script>
